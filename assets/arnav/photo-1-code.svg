<svg xmlns="http://www.w3.org/2000/svg" width="618" height="1100" viewBox="0 0 618 1100"><defs><pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="rgba(0,0,0,.08)"/></pattern></defs><rect width="618" height="1100" fill="#dbe9f6"/><rect width="618" height="1100" fill="url(#d)"/><rect x="40" y="200" width="538" height="560" rx="22" fill="#fff" stroke="#1b1b1b" stroke-width="3"/><circle cx="80" cy="245" r="10" fill="#fc9073"/><circle cx="112" cy="245" r="10" fill="#f6c740"/><circle cx="144" cy="245" r="10" fill="#9fb37a"/><text x="200" y="254" font-family="JetBrains Mono, Menlo, monospace" font-size="22" fill="#1b1b1b" opacity=".6">api/main.py</text><text x="70" y="330" font-family="JetBrains Mono, Menlo, monospace" font-size="27" fill="#fc9073">@app.post("/predict")</text><text x="70" y="388" font-family="JetBrains Mono, Menlo, monospace" font-size="27" fill="#1b1b1b">def predict(tx: Transaction):</text><text x="70" y="446" font-family="JetBrains Mono, Menlo, monospace" font-size="27" fill="#1b1b1b">    X = pipeline.transform(tx)</text><text x="70" y="504" font-family="JetBrains Mono, Menlo, monospace" font-size="27" fill="#1b1b1b">    p = model.predict_proba(X)</text><text x="70" y="562" font-family="JetBrains Mono, Menlo, monospace" font-size="27" fill="#1b1b1b">    flag = p &gt; THRESHOLD</text><text x="70" y="620" font-family="JetBrains Mono, Menlo, monospace" font-size="27" fill="#1b1b1b">    return {"fraud": flag,</text><text x="70" y="678" font-family="JetBrains Mono, Menlo, monospace" font-size="27" fill="#1b1b1b">            "score": p}</text><rect x="40" y="820" width="538" height="150" rx="22" fill="#f6c740" stroke="#1b1b1b" stroke-width="3"/><text x="80" y="885" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="34" fill="#1b1b1b" font-weight="700">FastAPI · Docker · Render</text><text x="80" y="935" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="26" fill="#1b1b1b" opacity=".75">from notebook to live endpoint</text></svg>