<svg xmlns="http://www.w3.org/2000/svg" width="675" height="900" viewBox="0 0 675 900"><defs><pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="rgba(0,0,0,.08)"/></pattern></defs><rect width="675" height="900" fill="#dbe9f6"/><rect width="675" height="900" fill="url(#d)"/><rect x="40" y="60" width="595" height="780" rx="22" fill="#fff" stroke="#1b1b1b" stroke-width="3"/><text x="80" y="150" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="26" fill="#1b1b1b" letter-spacing="3" opacity=".6">ARRAYS · HASHING</text><text x="80" y="230" font-family="DM Serif Display, Georgia, serif" font-size="62" fill="#1b1b1b" >Two Sum</text><rect x="80" y="270" width="150" height="48" rx="24" fill="#9fb37a" stroke="#1b1b1b" stroke-width="2"/><text x="100" y="303" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="24" fill="#1b1b1b" font-weight="700">Easy</text><text x="80" y="400" font-family="JetBrains Mono, Menlo, monospace" font-size="26" fill="#1b1b1b" opacity=".75">seen = {}</text><text x="80" y="450" font-family="JetBrains Mono, Menlo, monospace" font-size="26" fill="#1b1b1b" opacity=".75">for i, x in enumerate(a):</text><text x="80" y="500" font-family="JetBrains Mono, Menlo, monospace" font-size="26" fill="#1b1b1b" opacity=".75">  if t - x in seen:</text><text x="80" y="550" font-family="JetBrains Mono, Menlo, monospace" font-size="26" fill="#1b1b1b" opacity=".75">    return seen[t-x], i</text><text x="80" y="600" font-family="JetBrains Mono, Menlo, monospace" font-size="26" fill="#1b1b1b" opacity=".75">  seen[x] = i</text><circle cx="545" cy="750" r="46" fill="#9fb37a" stroke="#1b1b1b" stroke-width="3"/><path d="M523 750 l16 16 l30 -32" fill="none" stroke="#1b1b1b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>