# Keeps data/codechef.json in sync with the public CodeChef profile.
# Runs every 6 hours (and on demand from the Actions tab); commits only when
# a number actually changed, which also triggers the site's redeploy.
name: Update CodeChef stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest CodeChef ratings
        run: python scripts/update_codechef.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/codechef.json; then
            echo "No rating change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codechef.json
          git commit -m "Update CodeChef stats"
          git push
